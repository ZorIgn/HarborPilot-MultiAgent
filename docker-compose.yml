services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        INSTALL_OBSERVABILITY: ${HARBOR_AGENT_LANGFUSE_ENABLED:-false}
    environment:
      HARBOR_AGENT_LLM_MODE: ${HARBOR_AGENT_LLM_MODE:-mock}
      HARBOR_AGENT_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HARBOR_AGENT_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      HARBOR_AGENT_CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      HARBOR_AGENT_LANGFUSE_ENABLED: ${HARBOR_AGENT_LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-development}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3001:3001"
    depends_on:
      - api

